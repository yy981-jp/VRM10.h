name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++17 (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nlohmann-json3-dev
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get install -y clang
          fi

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DVRM10_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  vrm-schema:
    name: Official VRM JSON Schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned VRM specification
        uses: actions/checkout@v4
        with:
          repository: vrm-c/vrm-specification
          ref: 94e82dd346fa6cf0337c4421728640e5252dd38e
          path: .ci/vrm-specification

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate VRMC_vrm fixtures
        run: >-
          python scripts/validate_vrm_schema.py
          --spec-root .ci/vrm-specification

  external-vrm-validator:
    name: External VRM Validator
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned mrxz/vrm-validator
        uses: actions/checkout@v4
        with:
          repository: mrxz/vrm-validator
          ref: 43a0c8df2067d2d592fa18f12b824be8ce8ebb11
          path: .ci/vrm-validator

      - uses: dart-lang/setup-dart@v1.3
        with:
          sdk: "2.19.6"

      - name: Build external validator
        working-directory: .ci/vrm-validator
        run: |
          dart --version
          dart pub get
          dart run grinder exe

      - name: Validate VRM extension fixture
        run: |
          mkdir -p build/vrm-validator
          .ci/vrm-validator/build/bin/gltf_validator \
            --all \
            --stdout \
            tests/fixtures/models/minimal.vrm.gltf \
            > build/vrm-validator/report.json

      - name: Upload external validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-vrm-validator-report
          path: build/vrm-validator/report.json
          if-no-files-found: warn
